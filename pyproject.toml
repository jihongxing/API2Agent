[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api2agent"
version = "0.1.0rc2"
description = "Turn APIs into verified Agent capability packages."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
  "jinja2>=3.1",
  "mcp>=1.23",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
api2agent = "api2agent.cli:app"

[tool.setuptools.packages.find]
include = ["api2agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
