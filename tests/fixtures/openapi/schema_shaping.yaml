openapi: 3.1.0
info:
  title: Schema Shaping API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /users:
    post:
      operationId: createUser
      summary: Create user
      parameters:
        - name: mode
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
                - password
              properties:
                id:
                  type: string
                  readOnly: true
                name:
                  type: string
                nickname:
                  type: string
                  nullable: true
                password:
                  type: string
                  writeOnly: true
                labels:
                  type: object
                  additionalProperties:
                    type: string
                tags:
                  type: array
                  items:
                    type: object
                    required:
                      - key
                    properties:
                      key:
                        type: string
                      value:
                        type: string
                loose:
                  type: array
                choice:
                  oneOf:
                    - type: string
                    - type: object
                      properties:
                        nested:
                          anyOf:
                            - type: string
                            - type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                properties:
                  id:
                    type: string
                    readOnly: true
                  name:
                    type: string
                  password:
                    type: string
                    writeOnly: true
                  status:
                    type:
                      - string
                      - "null"
                  attributes:
                    type: object
                    additionalProperties: true
