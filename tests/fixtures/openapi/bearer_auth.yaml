openapi: 3.0.3
info:
  title: Bearer API
  version: 1.0.0
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /me:
    get:
      operationId: getMe
      summary: Fetch current user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK

