openapi: 3.0.3
info:
  title: Schema Keywords API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /users/{user_id}:
    get:
      operationId: getKeywordUser
      summary: Get keyword user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: email
          in: query
          schema:
            type: string
            format: email
            maxLength: 254
        - name: legacy
          in: query
          deprecated: true
          schema:
            type: string
            deprecated: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    type: string
                    format: uuid
                  profile_url:
                    type: string
                    format: uri
                  status:
                    type: string
                    const: active
                  age:
                    type: integer
                    minimum: 0
                    maximum: 150
                  code:
                    type: string
                    pattern: ^[A-Z]{3}-\d{4}$
                  tags:
                    type: array
                    minItems: 1
                    maxItems: 5
                    uniqueItems: true
                    items:
                      type: string
                  metadata:
                    type: object
                    patternProperties:
                      ^x-:
                        type: string
  /profiles:
    post:
      operationId: createKeywordProfile
      summary: Create keyword profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - age
                - tags
                - status
                - legacy_code
              dependentRequired:
                email:
                  - status
              if:
                properties:
                  status:
                    const: active
              then:
                required:
                  - activation_date
              properties:
                email:
                  type: string
                  format: email
                  minLength: 6
                  maxLength: 254
                website:
                  type: string
                  format: uri
                age:
                  type: integer
                  minimum: 0
                  maximum: 150
                rating:
                  type: number
                  exclusiveMinimum: 0
                  exclusiveMaximum: 5
                tags:
                  type: array
                  minItems: 2
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 3
                status:
                  type: string
                  const: active
                legacy_code:
                  type: string
                  deprecated: true
                activation_date:
                  type: string
                  format: date
                token:
                  type: string
                  pattern: ^tok_[A-Za-z0-9]+$
                step:
                  type: integer
                  multipleOf: 5
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
