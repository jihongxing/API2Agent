asyncapi: 3.0.0
info:
  title: Order Events API
  version: 1.0.0
servers:
  production:
    host: hooks.example.com
    protocol: https
channels:
  orderCreated:
    address: /webhooks/order-created
    bindings:
      http:
        method: POST
    messages:
      orderCreated:
        contentType: application/json
        payload:
          type: object
          properties:
            order_id:
              type: string
            amount:
              type: number
            expedited:
              type: boolean
          required:
            - order_id
        examples:
          - payload:
              order_id: ord_123
              amount: 42.5
              expedited: false
    publish:
      operationId: sendOrderCreated
      summary: Send an order-created webhook event.
      message:
        contentType: application/json
        payload:
          type: object
          properties:
            order_id:
              type: string
            amount:
              type: number
            expedited:
              type: boolean
          required:
            - order_id
        examples:
          - payload:
              order_id: ord_123
              amount: 42.5
              expedited: false
      bindings:
        http:
          method: POST
          successStatusCode: 202
  internalKafkaEvent:
    address: orders.internal
    messages:
      orderInternal:
        payload:
          type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
